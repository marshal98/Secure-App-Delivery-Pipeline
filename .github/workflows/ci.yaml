name: CI - Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: secure-notes-api

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Application
        run: |
          python -c "from app.main import app; print('Application loaded successfully')"

      - name: Build Docker Image
        run: |
          docker build \
            -t $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:${{ github.sha }} \
            -t $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:latest \
            .

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Images
        if: github.event_name == 'push'
        run: |
          docker push $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:${{ github.sha }}
          docker push $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:latest