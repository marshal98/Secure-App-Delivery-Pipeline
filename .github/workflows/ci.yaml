name: CI - Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: secure-notes-api

jobs:
  build-and-publish:
    name: Build, Scan & Publish
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Trivy
        run: |
          chmod +x ../scripts/install-trivy.sh
          ../scripts/install-trivy.sh

      - name: Install Syft
        run: |
          chmod +x ../scripts/install-syft.sh
          ../scripts/install-syft.sh

      - name: Verify Application
        run: |
          python -c "from app.main import app; print('Application loaded successfully')"

      - name: Build Docker Image
        run: |
          docker build \
            -t secure-notes-api:build \
            .          
                      
      - name: Scan Docker Image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            secure-notes-api:build

      - name: Generate SBOM
        run: |
          syft secure-notes-api:build \
            -o cyclonedx-json=sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sbom
          path: app/sbom.json

      - name: Tag Docker Image
        run: |
          docker tag secure-notes-api:build $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:${{ github.sha }}
          docker tag secure-notes-api:build $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:latest
      
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Images
        if: github.event_name == 'push'
        run: |
          docker push $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:${{ github.sha }}
          docker push $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:latest